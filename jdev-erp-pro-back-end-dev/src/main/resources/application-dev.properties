spring.application.name=JDevERP-PRO-DEV

#==========Conexao com banco de dados=========
spring.datasource.url=jdbc:postgresql://localhost:5433/jdev-erp-pro-dev?reWriteBatchedInserts=true&autoreconnect=true
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.platform=postgres
spring.datasource.dbcp2.pool-prepared-statements=true
spring.datasource.dbcp2.max-open-prepared-statements=450


#==========Contexto do projeto=============
server.servlet.context-path=/jdev-erp-pro-back-end-dev

#==========Spring Security=================
spring.security.user.name=admin
spring.security.user.password=admin

jwt.secret=TM9xZczkchaSNp8oW4uYFv6f1mKZL0SIfjh5RG2vsAl
jwt.expiration=86400000

server.port=8081

#==========Servlet e Upload=========
spring.servlet.multipart.max-file-size=600MB
spring.servlet.multipart.max-request-size=600MB
spring.servlet.multipart.enabled=true
server.servlet.session.timeout=60m
server.servlet.session.persistent=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true


#==========Compressão http=========
server.compression.enabled=false
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,application/x-www-form-urlencoded,application/octet-stream
server.compression.min-response-size=1024


#==========Configuração http padrão=========
server.http2.enabled=false
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.http.encoding.force-request=true
spring.http.encoding.force-response=true

#==========Hikari Pool=========
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.driver-class-name=${spring.datasource.driver-class-name}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.validation-timeout=5000
spring.datasource.dbcp2.pool-prepared-statements=true
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.data-source-properties.prepareThreshold=0




#==========Spring Data JPA=========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.javax.persistence.sharedCache.mode=ALL
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.redisson.entry.eviction.max_entries=400
spring.jpa.properties.hibernate.cache.redisson.entry.eviction.time_to_live=400
spring.jpa.properties.hibernate.cache.redisson.entry.eviction.max_idle_time=400
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy:create
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true



#==========Apache TomCat embutido no Spring Boot=========
server.tomcat.max-connections=50
server.tomcat.min-spare-threads=50
server.tomcat.max-threads=50
server.tomcat.accept-count=50
server.tomcat.uri-encoding=UTF-8
server.tomcat.processor-cache=50


#==========Configuração geral=========
spring.transaction.rollback-on-commit-failure=true
server.connection-timeout=90000
spring.session.jdbc.cleanup-cron=0 0 4 * * *



#==========Inicialização Spring Boot=========
spring.main.banner-mode=console
spring.main.web-application-type=servlet
spring.main.allow-bean-definition-overriding=true


#==========Spring MVC=========
#spring.mvc.static-path-pattern=/static/**
#spring.mvc.locale=pt_BR
#spring.mvc.locale-resolver=fixed
#spring.mvc.throw-exception-if-no-handler-found=true
#spring.web.resources.add-mappings=false
#server.error.include-message=never
#server.error.include-stacktrace=never
#server.error.include-exception=false
#server.error.whitelabel.enabled=false



#==========Cache de dev e produção=========
spring.resources.cache.cachecontrol.max-age=1d
spring.resources.cache.cachecontrol.cache-public=false
spring.resources.cache.cachecontrol.must-revalidate=true
spring.resources.cache.cachecontrol.no-store=true


#==========Cache de desenvolvimento=========
spring.devtools.add-properties=true
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,templates/**,test/**
spring.resources.cache.period=0


#==========Cache Jcache=========
#spring.cache.jcache.config=classpath:ehcache.xml
#spring.cache.jcache.provider=org.ehcache.jsr107.EhcacheCachingProvider



#==========Controle de LOG no console=========
logging.level.root=info
logging.level.web=error
logging.level.sql=error
logging.level.org.springframework.web=error
logging.level.org.hibernate.SQL=error
logging.level.org.hibernate.type.descriptor.sql=error
logging.file.name=jdev-erp-pro-back-end-dev.log
logging.file.max-history=5
logging.file.clean-history-on-start=true
logging.file.total-size-cap=50MB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.register-shutdown-hook=true
logging.level.org.hibernate=error
logging.level.org.springframework=error

